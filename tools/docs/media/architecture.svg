<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title description">
  <title id="title">RL Sim2Sim 系统架构与数据流</title>
  <desc id="description">资源与配置输入 Python 会话管理层。网页通过独立控制、遥测、渲染通道连接 C++ 控制与 ONNX 推理，以及 Gazebo 物理和原生相机。CSV 与视频分别保存。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5Z" fill="#2b6b85"/></marker>
  </defs>
  <rect x="1" y="1" width="1278" height="778" rx="20" fill="#e8f1fa" stroke="#b8d4e6" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" fill="#173341">
    <text x="36" y="46" font-size="20" font-weight="700">SYSTEM OVERVIEW</text>
    <text x="1240" y="45" text-anchor="end" font-size="13" fill="#395c70">配置 / 控制 / 遥测 / 图像 / 录制</text>
    <g>
      <rect x="334" y="78" width="876" height="122" rx="13" fill="#b8d4e6" stroke="#68a3c3"/>
      <text x="358" y="110" font-size="18" font-weight="650">Web Workbench</text>
      <text x="1186" y="110" text-anchor="end" font-size="12" fill="#2b6b85">HTML / CSS / JavaScript / Canvas</text>
      <rect x="358" y="131" width="248" height="44" rx="7" fill="#e8f1fa"/>
      <rect x="620" y="131" width="248" height="44" rx="7" fill="#e8f1fa"/>
      <rect x="882" y="131" width="304" height="44" rx="7" fill="#e8f1fa"/>
      <text x="482" y="159" text-anchor="middle" font-size="15">资源 · 参数 · 双摇杆</text>
      <text x="744" y="159" text-anchor="middle" font-size="15">实时画面 · 相机 · 录屏</text>
      <text x="1034" y="159" text-anchor="middle" font-size="15">信号 · 图表 · CSV 分析</text>
    </g>
    <g>
      <rect x="36" y="253" width="244" height="361" rx="13" fill="#e8f1fa" stroke="#68a3c3"/>
      <text x="58" y="286" font-size="17" font-weight="650">资源目录</text>
      <rect x="58" y="309" width="200" height="70" rx="8" fill="#b8d4e6"/>
      <text x="74" y="338" font-size="16" font-weight="650">configs/</text>
      <text x="74" y="361" font-size="13">机器人参数与部署契约</text>
      <rect x="58" y="393" width="200" height="70" rx="8" fill="#b8d4e6"/>
      <text x="74" y="422" font-size="16" font-weight="650">policies/</text>
      <text x="74" y="445" font-size="13">模型文件与策略版本</text>
      <rect x="58" y="477" width="200" height="70" rx="8" fill="#b8d4e6"/>
      <text x="74" y="506" font-size="16" font-weight="650">robots/</text>
      <text x="74" y="529" font-size="13">URDF / mesh / 控制器</text>
      <text x="58" y="581" font-size="13" fill="#395c70">third/ 提供第三方依赖</text>
    </g>
    <g>
      <rect x="334" y="253" width="876" height="112" rx="13" fill="#2b6b85"/>
      <text x="358" y="288" font-size="18" font-weight="650" fill="#e8f1fa">Python 服务与 ROS 桥接</text>
      <text x="358" y="319" font-size="15" fill="#e8f1fa">HTTP API · 会话管理 · 配置校验 · 参数快照</text>
      <text x="358" y="344" font-size="13" fill="#e8f1fa">tools/web/ — 控制、遥测、JPEG 与录制分别处理，共用一个运行会话</text>
    </g>
    <g>
      <rect x="334" y="442" width="410" height="172" rx="13" fill="#b8d4e6" stroke="#68a3c3"/>
      <text x="358" y="477" font-size="18" font-weight="650">C++ 控制与推理</text>
      <text x="358" y="510" font-size="15">rlsim_gazebo 节点 · ROS 接口</text>
      <text x="358" y="538" font-size="15">control/ 状态机与周期循环</text>
      <text x="358" y="566" font-size="15">inference/ 观测 → ONNX → 动作</text>
      <text x="358" y="593" font-size="12" fill="#395c70">具名张量 · 历史帧 · 循环状态 · 关节映射</text>
      <rect x="830" y="442" width="380" height="172" rx="13" fill="#b8d4e6" stroke="#68a3c3"/>
      <text x="854" y="477" font-size="18" font-weight="650">Gazebo Classic / ROS1</text>
      <text x="854" y="510" font-size="15">World · 机器人 · 物理仿真</text>
      <text x="854" y="538" font-size="15">ros_control · 关节与机身状态</text>
      <text x="854" y="566" font-size="15">原生观察相机 · 图像话题</text>
      <text x="854" y="593" font-size="12" fill="#395c70">不将 Gazebo GUI 窗口嵌入浏览器</text>
    </g>
    <g stroke="#2b6b85" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M772 202v46" marker-start="url(#arrow)"/>
      <path d="M282 310h45"/>
      <path d="M540 368v66" marker-start="url(#arrow)"/>
      <path d="M1020 368v66" marker-start="url(#arrow)"/>
      <path d="M751 530h70" marker-start="url(#arrow)"/>
    </g>
    <text x="792" y="232" font-size="12" fill="#395c70">同源 API / 数据 / 图像</text>
    <text x="354" y="410" font-size="12" fill="#395c70">控制服务 / 遥测话题</text>
    <text x="1040" y="410" font-size="12" fill="#395c70">机身状态 / 相机</text>
    <text x="786" y="508" text-anchor="middle" font-size="11" fill="#395c70">状态 / 命令</text>
    <rect x="334" y="662" width="876" height="76" rx="12" fill="#e8f1fa" stroke="#68a3c3"/>
    <text x="358" y="692" font-size="15" font-weight="650">按需保存，独立于网页绘图</text>
    <text x="358" y="718" font-size="13" fill="#395c70">tools/runs/：参数、必要日志、机器人 CSV（最近 5 次）   /   videos/：手动录制的 MP4</text>
  </g>
</svg>
