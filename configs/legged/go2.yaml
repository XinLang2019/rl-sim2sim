# Robot defaults, policy contracts and experiment presets. Vectors follow robot.joints.
schema_version: 1
kind: robot_profile
id: go2
robot:
  robot_name: go2
  variant: default
  package: go2_description
  package_path: robots/legged/go2_description
  urdf: robots/legged/go2_description/urdf/robot.urdf
  xacro: robots/legged/go2_description/urdf/gazebo.xacro
  controllers: robots/legged/go2_description/config/controllers.yaml
  namespace: /go2_gazebo/
  model_name: go2_gazebo
  joints: [FR_hip_joint, FR_thigh_joint, FR_calf_joint, FL_hip_joint, FL_thigh_joint, FL_calf_joint, RR_hip_joint, RR_thigh_joint, RR_calf_joint,
    RL_hip_joint, RL_thigh_joint, RL_calf_joint]
  groups:
    wheels: []
    legs: [FR_hip_joint, FR_thigh_joint, FR_calf_joint, FL_hip_joint, FL_thigh_joint, FL_calf_joint, RR_hip_joint, RR_thigh_joint, RR_calf_joint,
      RL_hip_joint, RL_thigh_joint, RL_calf_joint]
  excluded_plugins: []
control: null
diagnostics: [Robot assets imported; no validated default control/policy contract.]
policies:
  go2-himloco:
    schema_version: 1
    deployment:
      id: go2-himloco
      robots: [go2]
      status: blocked
      diagnostics: ['MISSING_POLICY_TYPE: base.yaml lacks policy_type required by ReadYamlBase; explicit inspection override does not fix runtime
          loading', 'CONFIG_INVALID: Select a supported policy_type: dreamwaq, ts, ts_se']
      model_directory: policies/legged/go2/himloco
  go2-legged-gym:
    schema_version: 1
    deployment:
      id: go2-legged-gym
      robots: [go2]
      status: unconfigured
      diagnostics: ['Model files imported; observation/action semantics, state bindings and control compatibility require an explicit policy contract.']
      model_directory: policies/legged/go2/legged_gym
  go2-robot-lab:
    schema_version: 1
    deployment:
      id: go2-robot-lab
      robots: [go2]
      status: blocked
      diagnostics: ['MISSING_POLICY_TYPE: base.yaml lacks policy_type required by ReadYamlBase; explicit inspection override does not fix runtime
          loading', 'CONFIG_INVALID: Select a supported policy_type: dreamwaq, ts, ts_se']
      model_directory: policies/legged/go2/robot_lab
  go2-wmp-traced-1:
    schema_version: 1
